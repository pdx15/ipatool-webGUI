name: Release ipatool WebGUI

on:
  workflow_dispatch:
    inputs:
      upstream_version:
        description: 'Version (e.g. 2.7.0, 2.7.0b for WebGUI hotfix on v2.7.0, or 2.7.1). Leave blank for latest release'
        required: false
        default: ''
  push:
    tags:
      - '*-webGUI'
      - 'v*'

permissions:
  contents: write

jobs:
  get_version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      raw_version: ${{ steps.version.outputs.raw_version }}
      upstream_tag: ${{ steps.version.outputs.upstream_tag }}
      release_version: ${{ steps.version.outputs.release_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Fetch version
        id: version
        run: |
          CUSTOM_VER="${{ github.event.inputs.upstream_version }}"
          if [ -n "$CUSTOM_VER" ]; then
            RAW_VER=$(echo "$CUSTOM_VER" | sed 's/^v//' | sed 's/-webGUI$//')
            UPSTREAM_VER=$(echo "$RAW_VER" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+)[a-zA-Z].*$/\1/')
            UPSTREAM_TAG="v${UPSTREAM_VER}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
            RAW_VER=$(echo "$TAG_NAME" | sed 's/^v//' | sed 's/-webGUI$//')
            UPSTREAM_VER=$(echo "$RAW_VER" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+)[a-zA-Z].*$/\1/')
            UPSTREAM_TAG="v${UPSTREAM_VER}"
          else
            LATEST_TAG=$(curl -s https://api.github.com/repos/majd/ipatool/releases/latest | jq -r '.tag_name // empty')
            if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
              LATEST_TAG="v2.7.0"
            fi
            RAW_VER="${LATEST_TAG#v}"
            UPSTREAM_TAG="$LATEST_TAG"
          fi

          RELEASE_VER="${RAW_VER}-webGUI"
          RELEASE_TAG="${RELEASE_VER}"

          echo "raw_version=${RAW_VER}" >> $GITHUB_OUTPUT
          echo "upstream_tag=${UPSTREAM_TAG}" >> $GITHUB_OUTPUT
          echo "release_version=${RELEASE_VER}" >> $GITHUB_OUTPUT
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT

          echo "Upstream Tag: $UPSTREAM_TAG"
          echo "Release Version: $RELEASE_VER"
          echo "Release Tag: $RELEASE_TAG"

  build_macos:
    name: Build macOS WebGUI binaries (ARM64 & AMD64)
    runs-on: macos-latest
    needs: [get_version]
    steps:
      - name: Checkout WebGUI repository
        uses: actions/checkout@v4
        with:
          path: webgui

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false

      - name: Clone upstream majd/ipatool
        run: |
          UPSTREAM_TAG="${{ needs.get_version.outputs.upstream_tag }}"
          echo "Cloning majd/ipatool @ $UPSTREAM_TAG"
          git clone --depth 1 --branch "$UPSTREAM_TAG" https://github.com/majd/ipatool.git ipatool || \
          git clone --depth 1 https://github.com/majd/ipatool.git ipatool

      - name: Add the WebGUI sources to the upstream tree
        run: |
          cd ipatool
          GUI_PATCH="../webgui/patches/register-gui.patch"
          METADATA_PATCH="../webgui/patches/minimum-os-version.patch"
          PRIORITY_PATCH="../webgui/patches/download-product-priority.patch"
          UPSTREAM_TAG="${{ needs.get_version.outputs.upstream_tag }}"

          # Keep the upstream integration narrow and explicit: register the GUI
          # command, expose MinimumOSVersion from the Info.plist that ipatool
          # already range-reads to build version metadata, and prioritize the
          # direct volumeStore download request ahead of the kbsync fallback.
          for PATCH in "$GUI_PATCH" "$METADATA_PATCH" "$PRIORITY_PATCH"; do
            if [ ! -f "$PATCH" ]; then
              echo "::error::Required upstream patch is missing: $PATCH"
              exit 1
            fi
            if ! git apply --check "$PATCH"; then
              echo "::error::$PATCH does not apply to ipatool $UPSTREAM_TAG; refresh the integration patch for that upstream tag."
              exit 1
            fi
          done

          git apply "$GUI_PATCH"
          git apply "$METADATA_PATCH"
          git apply "$PRIORITY_PATCH"
          cp -r ../webgui/cmd/gui* ./cmd/
          cp -r ../webgui/cmd/gui_assets ./cmd/
          mkdir -p ./resources
          cp -r ../webgui/resources/* ./resources/ 2>/dev/null || true

      - name: Verify the GUI builds with the minimal upstream metadata extension
        run: |
          cd ipatool
          # The only permitted package changes are the metadata implementation,
          # its test, exposing MinimumOSVersion from the IPA Info.plist, and the
          # volumeStore priority patch.
          unexpected_pkg_changes=$(git diff --name-only -- pkg/ | grep -Ev '^pkg/appstore/appstore_(get_version_metadata(_test)?|partial_zip|download(_product)?|list_versions|kbsync|lookup|(macos|platform)_version_lookup)\.go$' || true)
          if [ -n "$unexpected_pkg_changes" ]; then
            echo "::error::Unexpected changes to upstream package sources:"
            echo "$unexpected_pkg_changes"
            git diff --stat -- pkg/
            exit 1
          fi
          go build ./...

      - name: Build macOS Apple Silicon (ARM64)
        run: |
          cd ipatool
          VERSION="${{ needs.get_version.outputs.release_version }}"
          BIN_NAME="ipatool-${VERSION}-arm64-macOS"
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            CGO_CFLAGS="-mmacosx-version-min=10.15" \
            CGO_LDFLAGS="-mmacosx-version-min=10.15" \
            go build -trimpath -ldflags="-s -w -X github.com/majd/ipatool/v2/cmd.version=$VERSION" \
            -o "../${BIN_NAME}" .
          cd ..
          chmod +x "${BIN_NAME}"
          zip "${BIN_NAME}.zip" "${BIN_NAME}"

      - name: Build macOS Intel (AMD64)
        run: |
          cd ipatool
          VERSION="${{ needs.get_version.outputs.release_version }}"
          BIN_NAME="ipatool-${VERSION}-amd64-macOS"
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 \
            CGO_CFLAGS="-mmacosx-version-min=10.15" \
            CGO_LDFLAGS="-mmacosx-version-min=10.15" \
            go build -trimpath -ldflags="-s -w -X github.com/majd/ipatool/v2/cmd.version=$VERSION" \
            -o "../${BIN_NAME}" .
          cd ..
          chmod +x "${BIN_NAME}"
          zip "${BIN_NAME}.zip" "${BIN_NAME}"

      - name: Upload macOS ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: ipatool-${{ needs.get_version.outputs.release_version }}-arm64-macOS.zip
          path: ipatool-*-arm64-macOS.zip
          if-no-files-found: error

      - name: Upload macOS AMD64 binary
        uses: actions/upload-artifact@v4
        with:
          name: ipatool-${{ needs.get_version.outputs.release_version }}-amd64-macOS.zip
          path: ipatool-*-amd64-macOS.zip
          if-no-files-found: error

  build_windows:
    name: Build Windows package with WebGUI & libimobiledevice tools
    runs-on: ubuntu-latest
    needs: [get_version]
    steps:
      - name: Checkout WebGUI repository
        uses: actions/checkout@v4
        with:
          path: webgui

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false

      - name: Clone upstream majd/ipatool
        run: |
          UPSTREAM_TAG="${{ needs.get_version.outputs.upstream_tag }}"
          echo "Cloning majd/ipatool @ $UPSTREAM_TAG"
          git clone --depth 1 --branch "$UPSTREAM_TAG" https://github.com/majd/ipatool.git ipatool || \
          git clone --depth 1 https://github.com/majd/ipatool.git ipatool

      - name: Add the WebGUI sources to the upstream tree
        run: |
          cd ipatool
          GUI_PATCH="../webgui/patches/register-gui.patch"
          METADATA_PATCH="../webgui/patches/minimum-os-version.patch"
          PRIORITY_PATCH="../webgui/patches/download-product-priority.patch"
          UPSTREAM_TAG="${{ needs.get_version.outputs.upstream_tag }}"

          # Keep the upstream integration narrow and explicit: register the GUI
          # command, expose MinimumOSVersion from the Info.plist that ipatool
          # already range-reads to build version metadata, and prioritize the
          # direct volumeStore download request ahead of the kbsync fallback.
          for PATCH in "$GUI_PATCH" "$METADATA_PATCH" "$PRIORITY_PATCH"; do
            if [ ! -f "$PATCH" ]; then
              echo "::error::Required upstream patch is missing: $PATCH"
              exit 1
            fi
            if ! git apply --check "$PATCH"; then
              echo "::error::$PATCH does not apply to ipatool $UPSTREAM_TAG; refresh the integration patch for that upstream tag."
              exit 1
            fi
          done

          git apply "$GUI_PATCH"
          git apply "$METADATA_PATCH"
          git apply "$PRIORITY_PATCH"
          cp -r ../webgui/cmd/gui* ./cmd/
          cp -r ../webgui/cmd/gui_assets ./cmd/
          mkdir -p ./resources
          cp -r ../webgui/resources/* ./resources/ 2>/dev/null || true

      - name: Verify the GUI builds with the minimal upstream metadata extension
        run: |
          cd ipatool
          unexpected_pkg_changes=$(git diff --name-only -- pkg/ | grep -Ev '^pkg/appstore/appstore_(get_version_metadata(_test)?|partial_zip|download(_product)?|list_versions|kbsync|lookup|(macos|platform)_version_lookup)\.go$' || true)
          if [ -n "$unexpected_pkg_changes" ]; then
            echo "::error::Unexpected changes to upstream package sources:"
            echo "$unexpected_pkg_changes"
            git diff --stat -- pkg/
            exit 1
          fi
          GOOS=windows go build ./...

      - name: Build Windows binary (AMD64)
        run: |
          cd ipatool
          VERSION="${{ needs.get_version.outputs.release_version }}"
          GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w -X github.com/majd/ipatool/v2/cmd.version=$VERSION" \
            -o "../ipatool.exe" .

      - name: Download and extract libimobiledevice suite for Windows
        run: |
          mkdir -p libimobile-suite tools
          SUITE_URL=$(curl -s https://api.github.com/repos/L1ghtmann/libimobiledevice/releases/latest | jq -r '.assets[] | select(.name | endswith(".tar.xz")) | .browser_download_url' | head -n 1)
          if [ -z "$SUITE_URL" ] || [ "$SUITE_URL" = "null" ]; then
            SUITE_URL="https://github.com/L1ghtmann/libimobiledevice/releases/download/suite-exe-21d57a9/libimobile-suite-latest_x86_64-mingw64.tar.xz"
          fi
          echo "Downloading libimobiledevice from $SUITE_URL"
          curl -fsSL -o suite.tar.xz "$SUITE_URL"
          tar -xf suite.tar.xz -C libimobile-suite/

          # Copy ideviceinstaller, idevice_id and all accompanying DLLs
          find libimobile-suite/ -type f \( -name "*.exe" -o -name "*.dll" \) -exec cp {} tools/ \;
          ls -la tools/

      - name: Assemble Windows distribution zip
        run: |
          DIST="ipatool-${{ needs.get_version.outputs.release_version }}-windows"
          mkdir -p "$DIST"

          # 1. Compiled ipatool executable with WebGUI
          cp ipatool.exe "$DIST/ipatool.exe"

          # 2. Tools directory (ideviceinstaller, idevice_id, dlls)
          cp -r tools "$DIST/"

          # 3. WebGUI files and scripts
          cp webgui/ipatool-gui.bat "$DIST/"
          cp webgui/resources/Apps_ID_List.txt "$DIST/"

          # 4. Create ZIP archive
          zip -r "${DIST}.zip" "$DIST"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ipatool-${{ needs.get_version.outputs.release_version }}-windows.zip
          path: ipatool-*-windows.zip
          if-no-files-found: error

  release:
    name: Publish Release to GitHub
    runs-on: ubuntu-latest
    needs: [get_version, build_macos, build_windows]
    steps:
      - name: Download macOS ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: ipatool-${{ needs.get_version.outputs.release_version }}-arm64-macOS.zip
          path: ./dist

      - name: Download macOS AMD64 binary
        uses: actions/download-artifact@v4
        with:
          name: ipatool-${{ needs.get_version.outputs.release_version }}-amd64-macOS.zip
          path: ./dist

      - name: Download Windows zip package
        uses: actions/download-artifact@v4
        with:
          name: ipatool-${{ needs.get_version.outputs.release_version }}-windows.zip
          path: ./dist

      - name: List release assets
        run: |
          ls -la ./dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get_version.outputs.release_tag }}
          name: "ipatool webGUI ${{ needs.get_version.outputs.raw_version }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./dist/ipatool-*-arm64-macOS.zip
            ./dist/ipatool-*-amd64-macOS.zip
            ./dist/ipatool-*-windows.zip
