name: Build Windows 7 (legacy) binaries

# Manual workflow that produces Windows 7 compatible binaries.
#
# Why this is needed: the regular release is built with the stock Go
# toolchain (see go.mod: go 1.25). Since Go 1.21 the Go runtime requires
# Windows 10/Server 2016+. A stock binary crashes on Windows 7/8/8.1 right
# at startup with:
#
#   Exception 0xc0000005 0x8 0x0 0x0
#   PC=0x0
#   runtime.asmstdcall(...)
#   runtime/sys_windows_386.s:44 +0x2a
#
# (null call into a Windows API that does not exist on Win7, e.g.
# GetSystemTimePreciseAsFileTime / ProcessPrng / LoadLibraryEx requirements,
# plus a PE subsystem version of 10.0).
#
# This workflow instead uses the go-legacy-win7 toolchain
# (https://github.com/thongtech/go-legacy-win7) — a fork of upstream Go that
# reverts the Win8+/Win10-only API usage (RtlGenRandom fallback, LoadLibraryA
# fallback, sysSocket fallback, PE subsystem lowered to 6.1, etc.) and is
# tested down to Windows 7 RTM (build 7600).
#
# Artifacts:
#   ipatool-webGUI-windows7-386.zip   (contains ipatool.exe, Win7-safe)
#   sapsigner-windows7-shared.zip     (sapsigner.exe + libunicorn.dll) ← try first
#   sapsigner-windows7-static.zip     (sapsigner.exe, fully static)   ← fallback
#
# Notes / caveats:
#   - The main binary stays 32-bit (386) exactly like the regular release, so
#     it runs on both 32-bit and 64-bit Windows 7.
#   - Login on Windows additionally shells out to sapsigner.exe (Go binary in
#     tools/). The shipped copy is built with Go 1.26.5 and crashes on Win7,
#     so it is rebuilt here from the public source
#     (github.com/t0rr3sp3dr0/sapsigner, pinned commit — the same commit the
#     bundled binary was built from, before its private ucdll patch).
#   - sapsigner history on Win7: builds START fine but crashed inside
#     libunicorn twice, both times due to known Unicorn 2.1.x-on-Windows
#     engine bugs, so both sapsigner jobs PATCH the emulator source in CI:
#     (1) 0xc0000005 in uc_hook_add_insn for RDTSC [FIXED]: Unicorn 2.1.1's
#     x86_insn_hook_validate rejects RDTSC insn hooks; upstream tolerates
#     the error ("not supported → continue without hook") but the Windows
#     MinGW build segfaults on that path → emulator.go is patched to skip
#     the RDTSC HookAdd entirely (the no-hook fallback upstream already
#     uses in its own Docker CI).
#     (2) 0xc0000005 inside uc_mem_map for the first >4GB guest page
#     (0x100005000 ...) — unicorn-engine/unicorn#2010/#2055: since 2.1.0 the
#     default CPU TLB mishandles high guest addresses and Windows builds
#     outright crash → emulator.go is additionally patched to switch the
#     TLB to UC_TLB_VIRTUAL via uc_ctl right after uc_open (helper file
#     tlbctl_windows.go is generated by the same patch step because the
#     pinned Go binding predates the uc_ctl API).
#     (3) 0xc0000005 inside uc_ctl itself while switching the TLB mode —
#     in 2.1.1's Windows build even the variadic uc_ctl path segfaults,
#     so the engine version itself had to be changed: unicorn_tag now
#     defaults to 2.1.4 (the (1)/(2) patches are kept — they are harmless
#     on a fixed engine). Note: release assets were renamed from
#     windows_mingw64-* to windows-mingw64-* in 2.1.2+; the fetch steps
#     pick the right name from $UNICORN_TAG automatically.
#   - The rest of tools/ (libimobiledevice *.exe, 64-bit MSYS2 builds) is
#     only needed for the "Install to device" tab and is not rebuilt here;
#     it may or may not work on Windows 7. Search/download/auth flows do
#     not depend on it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string embedded into the binary (reported by `ipatool --version`)"
        required: true
        type: string
        default: "1.0.0-webGUI"
      unicorn_tag:
        description: "Unicorn engine release used to build sapsigner (2.1.4 by default: 2.1.1 segfaults on Windows in both uc_mem_map and uc_ctl; asset names are windows_mingw64-* up to 2.1.1, windows-mingw64-* from 2.1.2 on)"
        required: true
        type: string
        default: "2.1.4"

env:
  # Pinned upstream components (supply chain: version-pinned, not "latest").
  LEGACY_GO_TAG: "v1.27.0-2"                                        # go-legacy-win7 release = Go 1.27.0 + Win7 patches
  LEGACY_GO_ASSET: "go-legacy-win7-1.27.0-2.linux_amd64.tar.gz"
  SAPSIGNER_REPO: "t0rr3sp3dr0/sapsigner"
  SAPSIGNER_COMMIT: "883ede5d935829f045417578778dcb1ad227bf57"      # master
  UNICORN_TAG: ${{ inputs.unicorn_tag || '2.1.4' }}
  # Unicorn asset names differ between releases: <=2.1.1 used
  # "windows_mingw64-{shared,static}.7z", >=2.1.2 renamed them to
  # "windows-mingw64-{shared,static}.7z". The fetch steps resolve the name
  # from $UNICORN_TAG into $UNICORN_ASSET.

jobs:
  ipatool:
    name: Build ipatool.exe (Windows 7, 386)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64 (32-bit cross-compiler)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-i686

      - name: Install go-legacy-win7 toolchain
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/legacygo"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/go-legacy.tar.gz" \
            "https://github.com/thongtech/go-legacy-win7/releases/download/${LEGACY_GO_TAG}/${LEGACY_GO_ASSET}"
          tar -xzf "$RUNNER_TEMP/go-legacy.tar.gz" -C "$RUNNER_TEMP/legacygo"
          # The tarball has the standard Go layout (<root>/bin, <root>/VERSION, ...);
          # resolve the actual root regardless of the top-level folder name.
          GOROOT_DIR="$(dirname "$(find "$RUNNER_TEMP/legacygo" -maxdepth 3 -type f -name VERSION | head -1)")"
          echo "LEGACY_GOROOT=$GOROOT_DIR" >> "$GITHUB_ENV"
          "$GOROOT_DIR/bin/go" version

      - name: Build
        run: |
          "$LEGACY_GOROOT/bin/go" build -trimpath \
            -ldflags="-X github.com/majd/ipatool/v2/cmd.version=${{ inputs.version }}" \
            -o ipatool.exe
          sha256sum ipatool.exe > ipatool.exe.sha256sum
        env:
          GOOS: windows
          GOARCH: "386"
          CGO_ENABLED: "1"
          CC: i686-w64-mingw32-gcc
          CGO_LDFLAGS: -static
          GOTOOLCHAIN: local
          # cgo objects must also tolerate old Windows: target Vista/7-era APIs
          CGO_CFLAGS: -D_WIN32_WINNT=0x0601

      - name: Quick import sanity check
        run: |
          # Informational only: show imported DLLs and the PE subsystem
          # version (must be 6.1 for Windows 7 to load the binary).
          if command -v i686-w64-mingw32-objdump >/dev/null 2>&1; then
            i686-w64-mingw32-objdump -p ipatool.exe | grep -E "DLL Name|SubsystemVersion" | sort -u || true
          fi

      # Uploaded as a single file, so the downloaded zip
      # (ipatool-webGUI-windows7-386.zip) contains ipatool.exe at its root.
      - uses: actions/upload-artifact@v4
        with:
          name: ipatool-webGUI-windows7-386
          path: |
            ipatool.exe
            ipatool.exe.sha256sum
          if-no-files-found: error

  sapsigner-shared:
    name: Build sapsigner.exe (shared Unicorn DLL — TRY THIS FIRST, Windows 7, amd64)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout sapsigner source (pinned commit)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SAPSIGNER_REPO }}
          ref: ${{ env.SAPSIGNER_COMMIT }}
          path: sapsigner

      - name: Patch emulator.go (skip RDTSC hook + force virtual TLB - Windows libunicorn crash workarounds)
        working-directory: sapsigner
        run: |
          # This step applies two Windows-only workarounds for the Unicorn
          # 2.1.x engine (see also the header comment of this workflow):
          #
          #   1) Skip the RDTSC HookAdd call - MinGW builds of libunicorn
          #      segfault inside uc_hook_add_insn for X86_INS_RDTSC instead
          #      of returning UC_ERR_HOOK_ARG (cf. x86_insn_hook_validate),
          #      and upstream already runs fine in the "no RDTSC hook"
          #      fallback, so dropping the call is safe.
          #
          #   2) Right after uc_open, switch Unicorn's TLB implementation to
          #      UC_TLB_VIRTUAL via uc_ctl. Since Unicorn 2.1.0 the default
          #      CPU TLB mishandles high guest addresses: uc_mem_map either
          #      fails with UC_ERR_READ_UNMAPPED (unicorn-engine/unicorn#2010)
          #      or, on Windows, segfaults inside libunicorn.dll (issue
          #      #2055). sapsigner maps its first guest pages at 0x100004000+,
          #      so the crash hits immediately inside loadInterposer.
          python3 - <<'PY'
          import io

          fp = 'impl/emu/mescal/emulator/emulator.go'
          src = io.open(fp, encoding='utf-8').read()

          # 1) Replace hookRDTSC's HookAdd call entirely (see header comment).
          marker = 'func (e *Emulator) hookRDTSC() error {'
          i = src.index(marker)
          j = src.index('\n}\n', i)
          body = (marker + '\n'
                  '\t// Windows note: MinGW builds of libunicorn segfault inside\n'
                  '\t// uc_hook_add_insn for X86_INS_RDTSC (the insn is rejected by\n'
                  '\t// x86_insn_hook_validate in Unicorn 2.1.1; on Windows the\n'
                  '\t// error path crashes instead of returning an error). Skip\n'
                  '\t// the call entirely: upstream already runs fine in this\n'
                  '\t// "RDTSC hook unsupported" fallback mode.\n'
                  '\tlog.Logger().Print("RDTSC hook disabled (Windows libunicorn crash workaround)")\n'
                  '\n'
                  '\treturn nil\n')
          src = src[:i] + body + src[j:]

          # 2) Force the virtual TLB implementation right after uc_open.
          anchor = ('\tuc, err := unicorn.NewUnicorn(unicorn.ARCH_X86, unicorn.MODE_64)\n'
                    '\tif err != nil {\n'
                    '\t\treturn nil, err\n'
                    '\t}\n')
          k = src.index(anchor) + len(anchor)
          call = ('\n'
                  '\t// Windows note: the default CPU TLB of Unicorn >= 2.1 mishandles\n'
                  '\t// high guest addresses - uc_mem_map segfaults on Windows\n'
                  '\t// (unicorn-engine/unicorn#2010, #2055). Using the virtual TLB\n'
                  '\t// ("unhooked" software TLB) avoids it; see tlbctl_windows.go.\n'
                  '\tif err := setTLBVirtual(uc); err != nil {\n'
                  '\t\treturn nil, fmt.Errorf("failed to set Unicorn TLB virtual mode: %w", err)\n'
                  '\t}\n')
          src = src[:k] + call + src[k:]
          io.open(fp, 'w', encoding='utf-8').write(src)
          print('patched emulator.go: skipped RDTSC hook, forced virtual TLB')

          # 3) Drop in the cgo helper that performs the uc_ctl call. The Go
          #    binding pinned by go.mod predates the uc_ctl API, hence this
          #    tiny C shim (uc_ctl_tlb_mode is a function-like macro and must
          #    be expanded on the C side, it cannot be called from Go).
          hp = 'impl/emu/mescal/emulator/tlbctl_windows.go'
          helper = ('//go:build windows\n'
                    '\n'
                    'package emulator\n'
                    '\n'
                    '// Windows CI patch (ipatool-sapfix-webGUI fork): switch the Unicorn\n'
                    '// TLB implementation to UC_TLB_VIRTUAL right after uc_open, working\n'
                    '// around crashes / UC_ERR_READ_UNMAPPED in uc_mem_map for high guest\n'
                    '// addresses on Windows since Unicorn 2.1.0 (unicorn-engine/unicorn\n'
                    '// issues #2010 and #2055). The Go binding pinned by go.mod predates\n'
                    '// the uc_ctl API, so the call is made via this small cgo shim.\n'
                    '\n'
                    '/*\n'
                    '#include <unicorn/unicorn.h>\n'
                    '\n'
                    'static uc_err mescal_set_tlb_virtual(void *handle) {\n'
                    '\treturn uc_ctl_tlb_mode((uc_engine *)handle, UC_TLB_VIRTUAL);\n'
                    '}\n'
                    '*/\n'
                    'import "C"\n'
                    '\n'
                    'import (\n'
                    '\t"fmt"\n'
                    '\t"unsafe"\n'
                    '\n'
                    '\t"github.com/unicorn-engine/unicorn/bindings/go/unicorn"\n'
                    ')\n'
                    '\n'
                    'func setTLBVirtual(u unicorn.Unicorn) error {\n'
                    '\tif err := C.mescal_set_tlb_virtual(unsafe.Pointer(u.Handle())); err != C.UC_ERR_OK {\n'
                    '\t\treturn fmt.Errorf("uc_ctl(UC_CTL_TLB_TYPE, UC_TLB_VIRTUAL): %s", C.GoString(C.uc_strerror(err)))\n'
                    '\t}\n'
                    '\treturn nil\n'
                    '}\n')
          io.open(hp, 'w', encoding='utf-8').write(helper)
          print('wrote ' + hp)
          PY
          git --no-pager diff --stat || true

      - name: Install mingw-w64 (64-bit cross-compiler) and 7z
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 p7zip-full

      - name: Install go-legacy-win7 toolchain
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/legacygo"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/go-legacy.tar.gz" \
            "https://github.com/thongtech/go-legacy-win7/releases/download/${LEGACY_GO_TAG}/${LEGACY_GO_ASSET}"
          tar -xzf "$RUNNER_TEMP/go-legacy.tar.gz" -C "$RUNNER_TEMP/legacygo"
          GOROOT_DIR="$(dirname "$(find "$RUNNER_TEMP/legacygo" -maxdepth 3 -type f -name VERSION | head -1)")"
          echo "LEGACY_GOROOT=$GOROOT_DIR" >> "$GITHUB_ENV"
          "$GOROOT_DIR/bin/go" version

      - name: Fetch prebuilt Unicorn engine (mingw64 shared)
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/unicorn"
          # Unicorn <=2.1.1 ships assets as windows_mingw64-*, newer
          # releases renamed them to windows-mingw64-* (see the env comment).
          case "$UNICORN_TAG" in
            2.0.*|2.1.0|2.1.1) UNICORN_ASSET="windows_mingw64-shared.7z" ;;
            *)                 UNICORN_ASSET="windows-mingw64-shared.7z" ;;
          esac
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/unicorn.7z" \
            "https://github.com/unicorn-engine/unicorn/releases/download/${UNICORN_TAG}/${UNICORN_ASSET}"
          7z x "$RUNNER_TEMP/unicorn.7z" -o"$RUNNER_TEMP/unicorn" >/dev/null
          UNICORN_INCLUDE_DIR="$(dirname "$(dirname "$(find "$RUNNER_TEMP/unicorn" -name unicorn.h 2>/dev/null | head -1)")")"
          UNICORN_LIB_DIR="$(dirname "$(find "$RUNNER_TEMP/unicorn" -name 'libunicorn*.a' 2>/dev/null | head -1)")"
          UNICORN_DLL="$(find "$RUNNER_TEMP/unicorn" -name 'libunicorn*.dll' 2>/dev/null | head -1)"
          test -f "$UNICORN_INCLUDE_DIR/unicorn/unicorn.h"
          test -n "$UNICORN_LIB_DIR"
          test -f "$UNICORN_DLL"
          cp "$UNICORN_DLL" "$GITHUB_WORKSPACE/libunicorn.dll"
          echo "UNICORN_INCLUDE_DIR=$UNICORN_INCLUDE_DIR" >> "$GITHUB_ENV"
          echo "UNICORN_LIB_DIR=$UNICORN_LIB_DIR" >> "$GITHUB_ENV"
          # Debug listing. head(1) closes the pipe early, so tolerate the
          # resulting SIGPIPE from find instead of failing the step.
          { find "$RUNNER_TEMP/unicorn" -maxdepth 3 | head -40 || true; }

      - name: Build sapsigner.exe
        working-directory: sapsigner/impl/emu
        run: |
          "$LEGACY_GOROOT/bin/go" build -trimpath -ldflags="-s -w" \
            -o "$GITHUB_WORKSPACE/sapsigner.exe" ./cmd/sapsigner
          sha256sum "$GITHUB_WORKSPACE/sapsigner.exe" > "$GITHUB_WORKSPACE/sapsigner.exe.sha256sum"
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "1"
          CC: x86_64-w64-mingw32-gcc
          GOTOOLCHAIN: local
          CGO_CFLAGS: "-I${{ env.UNICORN_INCLUDE_DIR }} -D_WIN32_WINNT=0x0601"
          # Dynamic link against libunicorn.dll (import lib shipped in the
          # shared package); keep the mingw C runtime static so no
          # libwinpthread-1.dll / libgcc_s_seh-1.dll is needed on a clean
          # Windows 7 machine.
          CGO_LDFLAGS: "-L${{ env.UNICORN_LIB_DIR }} -lunicorn -lm -Wl,-Bstatic -lpthread -Wl,-Bdynamic -static-libgcc"

      - name: Write usage note
        run: |
          cat > "$GITHUB_WORKSPACE/README-win7.txt" <<'EOF'
          Using this sapsigner.exe on Windows 7:

          1. Copy sapsigner.exe into the tools\ folder of the release
             (replace the old one; keep sap-cache\ next to it).

          2. sapsigner.exe loads libunicorn.dll at run time. The tools\
             folder already contains a compatible MSYS2-built one —
             try AS IS first (nothing else to install).

          3. Only if you get "The procedure entry point ... could not be
             located in libunicorn.dll" (version mismatch with the older
             bundled DLL), overwrite tools\libunicorn.dll with the
             libunicorn.dll from this archive (Unicorn ${UNICORN_TAG}).
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: sapsigner-windows7-shared
          path: |
            sapsigner.exe
            sapsigner.exe.sha256sum
            libunicorn.dll
            README-win7.txt
          if-no-files-found: error

  sapsigner-static:
    name: Build sapsigner.exe (fully static — FALLBACK, Windows 7, amd64)
    runs-on: ubuntu-latest
    # Known issue: this variant starts on Win7 but crashes inside the
    # statically linked Unicorn (0xc0000005 in uc_hook_add_insn /
    # hookRDTSC, writing to 0x80000000). Kept for experiments; prefer
    # the "shared" job above.
    continue-on-error: true
    steps:
      - name: Checkout sapsigner source (pinned commit)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SAPSIGNER_REPO }}
          ref: ${{ env.SAPSIGNER_COMMIT }}
          path: sapsigner

      - name: Patch emulator.go (skip RDTSC hook + force virtual TLB - Windows libunicorn crash workarounds)
        working-directory: sapsigner
        run: |
          # This step applies two Windows-only workarounds for the Unicorn
          # 2.1.x engine (see also the header comment of this workflow):
          #
          #   1) Skip the RDTSC HookAdd call - MinGW builds of libunicorn
          #      segfault inside uc_hook_add_insn for X86_INS_RDTSC instead
          #      of returning UC_ERR_HOOK_ARG (cf. x86_insn_hook_validate),
          #      and upstream already runs fine in the "no RDTSC hook"
          #      fallback, so dropping the call is safe.
          #
          #   2) Right after uc_open, switch Unicorn's TLB implementation to
          #      UC_TLB_VIRTUAL via uc_ctl. Since Unicorn 2.1.0 the default
          #      CPU TLB mishandles high guest addresses: uc_mem_map either
          #      fails with UC_ERR_READ_UNMAPPED (unicorn-engine/unicorn#2010)
          #      or, on Windows, segfaults inside libunicorn.dll (issue
          #      #2055). sapsigner maps its first guest pages at 0x100004000+,
          #      so the crash hits immediately inside loadInterposer.
          python3 - <<'PY'
          import io

          fp = 'impl/emu/mescal/emulator/emulator.go'
          src = io.open(fp, encoding='utf-8').read()

          # 1) Replace hookRDTSC's HookAdd call entirely (see header comment).
          marker = 'func (e *Emulator) hookRDTSC() error {'
          i = src.index(marker)
          j = src.index('\n}\n', i)
          body = (marker + '\n'
                  '\t// Windows note: MinGW builds of libunicorn segfault inside\n'
                  '\t// uc_hook_add_insn for X86_INS_RDTSC (the insn is rejected by\n'
                  '\t// x86_insn_hook_validate in Unicorn 2.1.1; on Windows the\n'
                  '\t// error path crashes instead of returning an error). Skip\n'
                  '\t// the call entirely: upstream already runs fine in this\n'
                  '\t// "RDTSC hook unsupported" fallback mode.\n'
                  '\tlog.Logger().Print("RDTSC hook disabled (Windows libunicorn crash workaround)")\n'
                  '\n'
                  '\treturn nil\n')
          src = src[:i] + body + src[j:]

          # 2) Force the virtual TLB implementation right after uc_open.
          anchor = ('\tuc, err := unicorn.NewUnicorn(unicorn.ARCH_X86, unicorn.MODE_64)\n'
                    '\tif err != nil {\n'
                    '\t\treturn nil, err\n'
                    '\t}\n')
          k = src.index(anchor) + len(anchor)
          call = ('\n'
                  '\t// Windows note: the default CPU TLB of Unicorn >= 2.1 mishandles\n'
                  '\t// high guest addresses - uc_mem_map segfaults on Windows\n'
                  '\t// (unicorn-engine/unicorn#2010, #2055). Using the virtual TLB\n'
                  '\t// ("unhooked" software TLB) avoids it; see tlbctl_windows.go.\n'
                  '\tif err := setTLBVirtual(uc); err != nil {\n'
                  '\t\treturn nil, fmt.Errorf("failed to set Unicorn TLB virtual mode: %w", err)\n'
                  '\t}\n')
          src = src[:k] + call + src[k:]
          io.open(fp, 'w', encoding='utf-8').write(src)
          print('patched emulator.go: skipped RDTSC hook, forced virtual TLB')

          # 3) Drop in the cgo helper that performs the uc_ctl call. The Go
          #    binding pinned by go.mod predates the uc_ctl API, hence this
          #    tiny C shim (uc_ctl_tlb_mode is a function-like macro and must
          #    be expanded on the C side, it cannot be called from Go).
          hp = 'impl/emu/mescal/emulator/tlbctl_windows.go'
          helper = ('//go:build windows\n'
                    '\n'
                    'package emulator\n'
                    '\n'
                    '// Windows CI patch (ipatool-sapfix-webGUI fork): switch the Unicorn\n'
                    '// TLB implementation to UC_TLB_VIRTUAL right after uc_open, working\n'
                    '// around crashes / UC_ERR_READ_UNMAPPED in uc_mem_map for high guest\n'
                    '// addresses on Windows since Unicorn 2.1.0 (unicorn-engine/unicorn\n'
                    '// issues #2010 and #2055). The Go binding pinned by go.mod predates\n'
                    '// the uc_ctl API, so the call is made via this small cgo shim.\n'
                    '\n'
                    '/*\n'
                    '#include <unicorn/unicorn.h>\n'
                    '\n'
                    'static uc_err mescal_set_tlb_virtual(void *handle) {\n'
                    '\treturn uc_ctl_tlb_mode((uc_engine *)handle, UC_TLB_VIRTUAL);\n'
                    '}\n'
                    '*/\n'
                    'import "C"\n'
                    '\n'
                    'import (\n'
                    '\t"fmt"\n'
                    '\t"unsafe"\n'
                    '\n'
                    '\t"github.com/unicorn-engine/unicorn/bindings/go/unicorn"\n'
                    ')\n'
                    '\n'
                    'func setTLBVirtual(u unicorn.Unicorn) error {\n'
                    '\tif err := C.mescal_set_tlb_virtual(unsafe.Pointer(u.Handle())); err != C.UC_ERR_OK {\n'
                    '\t\treturn fmt.Errorf("uc_ctl(UC_CTL_TLB_TYPE, UC_TLB_VIRTUAL): %s", C.GoString(C.uc_strerror(err)))\n'
                    '\t}\n'
                    '\treturn nil\n'
                    '}\n')
          io.open(hp, 'w', encoding='utf-8').write(helper)
          print('wrote ' + hp)
          PY
          git --no-pager diff --stat || true

      - name: Install mingw-w64 (64-bit cross-compiler) and 7z
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 p7zip-full

      - name: Install go-legacy-win7 toolchain
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/legacygo"
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/go-legacy.tar.gz" \
            "https://github.com/thongtech/go-legacy-win7/releases/download/${LEGACY_GO_TAG}/${LEGACY_GO_ASSET}"
          tar -xzf "$RUNNER_TEMP/go-legacy.tar.gz" -C "$RUNNER_TEMP/legacygo"
          GOROOT_DIR="$(dirname "$(find "$RUNNER_TEMP/legacygo" -maxdepth 3 -type f -name VERSION | head -1)")"
          echo "LEGACY_GOROOT=$GOROOT_DIR" >> "$GITHUB_ENV"
          "$GOROOT_DIR/bin/go" version

      - name: Fetch prebuilt Unicorn engine (mingw64 static)
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/unicorn"
          # Unicorn <=2.1.1 ships assets as windows_mingw64-*, newer
          # releases renamed them to windows-mingw64-* (see the env comment).
          case "$UNICORN_TAG" in
            2.0.*|2.1.0|2.1.1) UNICORN_ASSET="windows_mingw64-static.7z" ;;
            *)                 UNICORN_ASSET="windows-mingw64-static.7z" ;;
          esac
          curl -fL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/unicorn.7z" \
            "https://github.com/unicorn-engine/unicorn/releases/download/${UNICORN_TAG}/${UNICORN_ASSET}"
          7z x "$RUNNER_TEMP/unicorn.7z" -o"$RUNNER_TEMP/unicorn" >/dev/null
          # Resolve include/ and lib/ locations inside the archive, whatever
          # the top-level layout is.
          UNICORN_INCLUDE_DIR="$(dirname "$(dirname "$(find "$RUNNER_TEMP/unicorn" -name unicorn.h 2>/dev/null | head -1)")")"
          UNICORN_LIB_DIR="$(dirname "$(find "$RUNNER_TEMP/unicorn" -name 'libunicorn*.a' 2>/dev/null | head -1)")"
          test -f "$UNICORN_INCLUDE_DIR/unicorn/unicorn.h"
          test -n "$UNICORN_LIB_DIR"
          echo "UNICORN_INCLUDE_DIR=$UNICORN_INCLUDE_DIR" >> "$GITHUB_ENV"
          echo "UNICORN_LIB_DIR=$UNICORN_LIB_DIR" >> "$GITHUB_ENV"
          # Debug listing. head(1) closes the pipe early, so tolerate the
          # resulting SIGPIPE from find instead of failing the step.
          { find "$RUNNER_TEMP/unicorn" -maxdepth 3 | head -40 || true; }

      - name: Build sapsigner.exe
        working-directory: sapsigner/impl/emu
        run: |
          "$LEGACY_GOROOT/bin/go" build -trimpath -ldflags="-s -w" \
            -o "$GITHUB_WORKSPACE/sapsigner.exe" ./cmd/sapsigner
          sha256sum "$GITHUB_WORKSPACE/sapsigner.exe" > "$GITHUB_WORKSPACE/sapsigner.exe.sha256sum"
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "1"
          CC: x86_64-w64-mingw32-gcc
          GOTOOLCHAIN: local
          CGO_CFLAGS: "-I${{ env.UNICORN_INCLUDE_DIR }} -D_WIN32_WINNT=0x0601"
          # Link Unicorn AND the mingw C runtime fully statically so the
          # resulting sapsigner.exe needs no libwinpthread-1.dll /
          # libgcc_s_seh-1.dll next to it (a clean Windows 7 box has neither
          # and the loader aborts with STATUS_DLL_NOT_FOUND, 0xC0000135).
          CGO_LDFLAGS: "-L${{ env.UNICORN_LIB_DIR }} -static -lunicorn -lm -lpthread -static-libgcc"

      - uses: actions/upload-artifact@v4
        with:
          name: sapsigner-windows7-static
          path: |
            sapsigner.exe
            sapsigner.exe.sha256sum
          if-no-files-found: error