name: Build macOS binaries (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (e.g. 2.3.2-sapfix.2)"
        required: true
        default: "2.3.2-sapfix.2"

permissions:
  contents: write

jobs:
  build_macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          go build -trimpath \
            -ldflags="-X github.com/majd/ipatool/v2/cmd.version=${{ inputs.version }}" \
            -o ipatool-${{ inputs.version }}-macos-${{ matrix.arch }}
          chmod +x ipatool-${{ inputs.version }}-macos-${{ matrix.arch }}
          ./ipatool-${{ inputs.version }}-macos-${{ matrix.arch }} --version
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
          CGO_CFLAGS: -mmacosx-version-min=10.15
          CGO_LDFLAGS: -mmacosx-version-min=10.15

      - name: Archive
        run: |
          mkdir -p bin
          cp ipatool-${{ inputs.version }}-macos-${{ matrix.arch }} bin/
          tar -czvf ipatool-${{ inputs.version }}-macos-${{ matrix.arch }}.tar.gz bin/ipatool-${{ inputs.version }}-macos-${{ matrix.arch }}
          shasum -a 256 ipatool-${{ inputs.version }}-macos-${{ matrix.arch }}.tar.gz > ipatool-${{ inputs.version }}-macos-${{ matrix.arch }}.tar.gz.sha256sum

      - uses: actions/upload-artifact@v4
        with:
          name: ipatool-${{ inputs.version }}-macos-${{ matrix.arch }}.tar.gz
          path: |
            ipatool-${{ inputs.version }}-macos-${{ matrix.arch }}.tar.gz
            ipatool-${{ inputs.version }}-macos-${{ matrix.arch }}.tar.gz.sha256sum

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build_macos
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          prerelease: true
          files: ./dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
