name: Build Windows WebGUI (Test)

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream majd/ipatool git ref: tag (v2.8.0), branch (main) or commit SHA. Leave blank for DEFAULT_UPSTREAM_REF.'
        required: false
        default: ''
      upstream_version:
        description: 'WebGUI version (e.g. 2.8.0, 2.8.0b, or 2.8.1). Leave blank to derive it from the ref.'
        required: false
        default: ''

env:
  # The upstream commit the integration patches are written against.
  # Bump it together with patches/ when moving to a newer upstream commit.
  DEFAULT_UPSTREAM_REF: 'e0e2908dc866651cbd6ad86edd954119c003c46b'

permissions:
  contents: read

jobs:
  get_version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      raw_version: ${{ steps.version.outputs.raw_version }}
      upstream_ref: ${{ steps.version.outputs.upstream_ref }}
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - name: Fetch version
        id: version
        run: |
          REF="${{ github.event.inputs.upstream_ref }}"
          if [ -z "$REF" ]; then
            REF="$DEFAULT_UPSTREAM_REF"
          fi

          VER="${{ github.event.inputs.upstream_version }}"
          VER=$(echo "$VER" | sed 's/^v//' | sed 's/-webGUI$//')

          if [ -z "$VER" ]; then
            if echo "$REF" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
              VER=$(echo "$REF" | sed 's/^v//')
            else
              LATEST_TAG=$(curl -s https://api.github.com/repos/majd/ipatool/releases/latest | jq -r '.tag_name // empty')
              if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
                LATEST_TAG="v2.8.0"
              fi
              if echo "$REF" | grep -Eq '^[0-9a-f]{7,40}$'; then
                REF_LABEL=$(echo "$REF" | cut -c1-7)
              else
                REF_LABEL=$(echo "$REF" | tr '/' '-' | tr -cd '[:alnum:]._-' | cut -c1-12)
              fi
              VER="${LATEST_TAG#v}-${REF_LABEL}"
            fi
          fi

          RELEASE_VER="${VER}-webGUI"

          echo "upstream_ref=${REF}" >> $GITHUB_OUTPUT
          echo "raw_version=${VER}" >> $GITHUB_OUTPUT
          echo "release_version=${RELEASE_VER}" >> $GITHUB_OUTPUT

          echo "Upstream Ref: $REF"
          echo "Build Version: $RELEASE_VER"

  build_windows:
    name: Build Windows package with WebGUI & libimobiledevice tools
    runs-on: ubuntu-latest
    needs: [get_version]
    steps:
      - name: Checkout WebGUI repository
        uses: actions/checkout@v4
        with:
          path: webgui

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: false

      - name: Clone upstream majd/ipatool
        run: |
          UPSTREAM_REF="${{ needs.get_version.outputs.upstream_ref }}"
          echo "Cloning majd/ipatool @ $UPSTREAM_REF"
          if echo "$UPSTREAM_REF" | grep -Eq '^[0-9a-f]{7,40}$'; then
            # A commit SHA cannot be passed to --branch, so clone the repository
            # and check the requested commit out explicitly. The integration
            # patches target one concrete upstream commit, so the build must
            # never silently fall back to the default branch.
            git clone https://github.com/majd/ipatool.git ipatool
            git -C ipatool checkout --detach "$UPSTREAM_REF"
          else
            git clone --depth 1 --branch "$UPSTREAM_REF" https://github.com/majd/ipatool.git ipatool
          fi

          RESOLVED=$(git -C ipatool rev-parse HEAD)
          echo "Resolved upstream commit: $RESOLVED"
          if echo "$UPSTREAM_REF" | grep -Eq '^[0-9a-f]{40}$' && [ "$RESOLVED" != "$UPSTREAM_REF" ]; then
            echo "::error::Checked out $RESOLVED but $UPSTREAM_REF was requested"
            exit 1
          fi

      - name: Add the WebGUI sources to the upstream tree
        run: |
          cd ipatool
          GUI_PATCH="../webgui/patches/register-gui.patch"
          METADATA_PATCH="../webgui/patches/minimum-os-version.patch"
          PRIORITY_PATCH="../webgui/patches/download-product-priority.patch"
          UPSTREAM_REF="${{ needs.get_version.outputs.upstream_ref }}"

          for PATCH in "$GUI_PATCH" "$METADATA_PATCH" "$PRIORITY_PATCH"; do
            if [ ! -f "$PATCH" ]; then
              echo "::error::Required upstream patch is missing: $PATCH"
              exit 1
            fi
            if ! git apply --check "$PATCH"; then
              echo "::error::$PATCH does not apply to ipatool $UPSTREAM_REF; refresh the integration patch for that upstream ref."
              exit 1
            fi
          done

          git apply "$GUI_PATCH"
          git apply "$METADATA_PATCH"
          git apply "$PRIORITY_PATCH"
          cp -r ../webgui/cmd/gui* ./cmd/
          cp -r ../webgui/cmd/gui_assets ./cmd/
          mkdir -p ./resources
          cp -r ../webgui/resources/* ./resources/ 2>/dev/null || true

      - name: Verify the GUI builds with the minimal upstream metadata extension
        run: |
          cd ipatool
          unexpected_pkg_changes=$(git diff --name-only -- pkg/ | grep -Ev '^pkg/appstore/(appstore_(get_version_metadata(_test)?|partial_zip|download(_product)?|kbsync|lookup|(macos|platform)_version_(lookup|metadata)|macos_preflight_metadata)|storefront)\.go$' || true)
          if [ -n "$unexpected_pkg_changes" ]; then
            echo "::error::Unexpected changes to upstream package sources:"
            echo "$unexpected_pkg_changes"
            git diff --stat -- pkg/
            exit 1
          fi
          GOOS=windows go build ./...
          go test ./cmd/ -run 'TestRenameDownloaded' -count=1

      - name: Build Windows binary (AMD64)
        run: |
          cd ipatool
          VERSION="${{ needs.get_version.outputs.release_version }}"
          GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w -X github.com/majd/ipatool/v2/cmd.version=$VERSION" \
            -o "../ipatool.exe" .

      - name: Download and extract libimobiledevice suite for Windows
        run: |
          mkdir -p libimobile-suite tools
          SUITE_URL=$(curl -s https://api.github.com/repos/L1ghtmann/libimobiledevice/releases/latest | jq -r '.assets[] | select(.name | endswith(".tar.xz")) | .browser_download_url' | head -n 1)
          if [ -z "$SUITE_URL" ] || [ "$SUITE_URL" = "null" ]; then
            SUITE_URL="https://github.com/L1ghtmann/libimobiledevice/releases/download/suite-exe-21d57a9/libimobile-suite-latest_x86_64-mingw64.tar.xz"
          fi
          echo "Downloading libimobiledevice from $SUITE_URL"
          curl -fsSL -o suite.tar.xz "$SUITE_URL"
          tar -xf suite.tar.xz -C libimobile-suite/

          find libimobile-suite/ -type f \( -name "*.exe" -o -name "*.dll" \) -exec cp {} tools/ \;
          ls -la tools/

      - name: Assemble Windows distribution
        run: |
          DIST="ipatool-${{ needs.get_version.outputs.release_version }}-windows"
          mkdir -p "$DIST"

          cp ipatool.exe "$DIST/ipatool.exe"
          cp -r tools "$DIST/"
          cp webgui/ipatool-gui.bat "$DIST/"
          cp webgui/resources/Apps_ID_List.txt "$DIST/"

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipatool-${{ needs.get_version.outputs.release_version }}-windows
          path: ipatool-${{ needs.get_version.outputs.release_version }}-windows
          if-no-files-found: error

  probe_go124:
    name: TEMP probe Go 1.24 build for Catalina
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: webgui

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.8'
          cache: false

      - name: Build the patched tree with Go 1.24 for darwin/amd64
        run: |
          set -euo pipefail
          git clone https://github.com/majd/ipatool.git ipatool
          git -C ipatool checkout --detach e0e2908dc866651cbd6ad86edd954119c003c46b
          cd ipatool
          for PATCH in ../webgui/patches/register-gui.patch ../webgui/patches/minimum-os-version.patch ../webgui/patches/download-product-priority.patch; do
            git apply "$PATCH"
          done
          cp -r ../webgui/cmd/gui* ./cmd/
          cp -r ../webgui/cmd/gui_assets ./cmd/
          go mod edit -go=1.24.8
          echo "== go version =="
          go version
          echo "== build =="
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build ./... 2>&1 | head -40 || true
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/ipatool-legacy . 2>&1 | head -40 || echo "::error::go1.24 build failed (see log)"
          test -f /tmp/ipatool-legacy && echo "::notice::go1.24 darwin/amd64 build OK"
