name: TEMP macOS tools probe

on:
  workflow_dispatch:

jobs:
  probe:
    name: Probe the macOS libimobiledevice bundle
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bundle libimobiledevice device tools
        id: tools
        run: |
          set -euo pipefail

          echo "runner arch: $(uname -m), macOS: $(sw_vers -productVersion)"

          brew install libimobiledevice ideviceinstaller

          PREFIX="$(brew --prefix)"
          TOOLS="$GITHUB_WORKSPACE/tools"
          mkdir -p "$TOOLS"

          for tool in idevice_id ideviceinfo ideviceinstaller; do
            if [ ! -x "$PREFIX/bin/$tool" ]; then
              echo "::error::$PREFIX/bin/$tool is missing; the macOS bundle needs it."
              exit 1
            fi
            cp -f "$PREFIX/bin/$tool" "$TOOLS/"
          done

          pending=()
          for file in "$TOOLS"/*; do
            pending+=("$file")
          done

          while [ ${#pending[@]} -gt 0 ]; do
            file="${pending[0]}"
            pending=("${pending[@]:1}")
            chmod u+w "$file"

            while read -r dep; do
              case "$dep" in
                "$PREFIX"/*) source_path="$dep" ;;
                @rpath/*) source_path="$PREFIX/lib/${dep#@rpath/}" ;;
                *) continue ;;
              esac
              if [ ! -f "$source_path" ]; then
                continue
              fi

              library="$(basename "$source_path")"
              if [ ! -f "$TOOLS/$library" ]; then
                cp -f "$source_path" "$TOOLS/$library"
                chmod u+w "$TOOLS/$library"
                pending+=("$TOOLS/$library")
              fi

              install_name_tool -change "$dep" "@executable_path/$library" "$file"
            done < <(otool -L "$file" | tail -n +2 | awk '{print $1}')
          done

          for library in "$TOOLS"/*.dylib; do
            chmod u+w "$library"
            install_name_tool -id "@executable_path/$(basename "$library")" "$library"
          done

          chmod +x "$TOOLS"/idevice_id "$TOOLS"/ideviceinfo "$TOOLS"/ideviceinstaller

          codesign --force --sign - "$TOOLS"/*

          echo "== bundle contents =="
          ls -la "$TOOLS"

          echo "== ideviceinstaller load commands =="
          otool -L "$TOOLS/ideviceinstaller"

          echo "== smoke test with an empty environment =="
          env -i "$TOOLS/ideviceinstaller" --help | head -n 5

          echo "== idevice_id =="
          env -i "$TOOLS/idevice_id" -h 2>&1 | head -n 3 || true

          echo "== ideviceinfo =="
          env -i "$TOOLS/ideviceinfo" -h 2>&1 | head -n 3 || true

          case "$(uname -m)" in
            arm64) suffix=arm64 ;;
            x86_64) suffix=amd64 ;;
            *) echo "::error::Unsupported macOS architecture $(uname -m)"; exit 1 ;;
          esac
          echo "suffix=${suffix}" >> "$GITHUB_OUTPUT"

          zip -qry "$GITHUB_WORKSPACE/tools-macos.zip" tools

      - name: Add the device tools to the matching macOS archive
        run: |
          set -euo pipefail

          SUFFIX="${{ steps.tools.outputs.suffix }}"
          ARCHIVE="ipatool-2.8.0c-webGUI-${SUFFIX}-macOS.zip"

          echo "dummy" > "ipatool-2.8.0c-webGUI-${SUFFIX}-macOS"
          chmod +x "ipatool-2.8.0c-webGUI-${SUFFIX}-macOS"
          zip -q "$ARCHIVE" "ipatool-2.8.0c-webGUI-${SUFFIX}-macOS"

          rm -rf unpacked
          mkdir unpacked
          unzip -q "$ARCHIVE" -d unpacked
          unzip -q tools-macos.zip -d unpacked
          rm -f "$ARCHIVE"
          (cd unpacked && zip -qry "../$ARCHIVE" .)

          unzip -l "$ARCHIVE" | grep -E 'tools/(ideviceinstaller|idevice_id|ideviceinfo)$'

          echo "== archive size =="
          ls -la "$ARCHIVE"
          du -sh tools
